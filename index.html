<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#ff4fc3">
    <title>Flamingo Extension</title>
  <script type="module" crossorigin src="/flamingo-app/assets/index-BGU42JZO.js"></script>
  <link rel="stylesheet" crossorigin href="/flamingo-app/assets/index-CgBvFbBg.css">
</head>

<body>
    <div id="map"></div>
    <div id="top">
        <div id="bar"><md-icon-button id="menuBtn" aria-label="Open navigation"><md-icon>menu</md-icon></md-icon-button>
            <input id="q" type="search" placeholder="Search places" aria-label="Search places" autocomplete="off">
            <md-icon-button id="clearQ" hidden aria-label="Clear search"><md-icon>close</md-icon></md-icon-button>
        </div>
        <md-list id="results" hidden></md-list>
    </div>
    <div id="side">
        <md-filled-tonal-icon-button id="sound" toggle selected
            aria-label="Turn music off"><md-icon>volume_off</md-icon><md-icon
                slot="selected">volume_up</md-icon></md-filled-tonal-icon-button>
        <md-filled-tonal-icon-button id="ridersBtn" toggle selected
            aria-label="Hide other riders"><md-icon>groups</md-icon><md-icon
                slot="selected">groups</md-icon></md-filled-tonal-icon-button>
        <md-fab id="recentre" size="small" variant="surface" aria-label="Recentre on scooter"><md-icon
                slot="icon">my_location</md-icon></md-fab>
    </div>
    <div id="hint"><span>Take an unexpected journey!</span><md-icon>arrow_downward</md-icon></div>
    <div id="sheets">
        <div id="trip" hidden><b id="tripTitle"></b><small id="tripSub"></small><md-linear-progress id="bar2"
                value="0"></md-linear-progress>
            <div class="btns"><md-filled-tonal-button id="pauseBtn"><md-icon
                        slot="icon">pause</md-icon>Pause</md-filled-tonal-button>
                <md-filled-tonal-button id="skipBtn"><md-icon
                        slot="icon">skip_next</md-icon>Skip</md-filled-tonal-button>
                <md-outlined-button id="cancelBtn"><md-icon slot="icon">cancel</md-icon>Cancel</md-outlined-button>
            </div>
        </div>
        <div id="info" hidden></div>
        <div id="actions" class="glow"><md-filled-tonal-button id="rndLoc"><md-icon slot="icon">place</md-icon>Go to
                location</md-filled-tonal-button>
            <md-filled-tonal-button id="rndAct"><md-icon slot="icon">local_activity</md-icon>Go to
                activity</md-filled-tonal-button>
        </div>
    </div>
    <div id="scrim" hidden></div>
    <aside id="rail" aria-label="Navigation" aria-hidden="true">
        <md-icon-button id="railClose" aria-label="Close navigation"><md-icon>menu_open</md-icon></md-icon-button>
        <button class="rail-item"
            data-nav="map"><md-ripple></md-ripple><md-focus-ring></md-focus-ring><md-icon>map</md-icon><span>Map</span></button>
        <button class="rail-item"
            data-nav="activity"><md-ripple></md-ripple><md-focus-ring></md-focus-ring><md-icon>local_activity</md-icon><span>Activities</span></button>
        <button class="rail-item"
            data-nav="location"><md-ripple></md-ripple><md-focus-ring></md-focus-ring><md-icon>place</md-icon><span>Locations</span></button>
    </aside>
    <section id="page" hidden></section>
    <div id="gem" hidden role="dialog" aria-modal="true" aria-labelledby="gemName">
        <div class="gemBox"><small>Collectible found!</small>
            <div id="gemArt" class="thumbBig"></div>
            <h2 id="gemName"></h2>
            <p id="gemText"></p>
            <md-filled-button id="gemClose"><md-icon slot="icon">close</md-icon>Close</md-filled-button>
        </div>
    </div>
    <div id="intro">
        <div id="logo"><img id="logoImg" alt=""><svg id="sparkSvg" aria-hidden="true"></svg></div>
        <div id="introTitle">Time to leave the nest!</div>
        <md-text-button id="skipIntro" hidden>Skip<md-icon slot="icon">skip_next</md-icon></md-text-button><button
            id="gate">Tap to start</button>
    </div>
</body>

</html>
